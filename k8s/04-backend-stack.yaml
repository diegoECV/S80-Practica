# ==============================================================================
# MANIFIESTO: 04-backend-stack.yaml
# DESCRIPCIÓN: Despliegue del Backend API (consumo vía envFrom) y Servicio NodePort
# ==============================================================================

# 1. DEPLOYMENT DEL BACKEND API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s08
  labels:
    app: backend-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        tier: backend
    spec:
      containers:
        - name: backend-api
          image: backend-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-port
          # Requisito clave: Inyección desacoplada en bloque mediante envFrom
          envFrom:
            # Inyecta DB_HOST, DB_NAME, APP_PORT desde el ConfigMap
            - configMapRef:
                name: app-configmap
            # Inyecta DB_USER, DB_PASS desde el Secret
            - secretRef:
                name: db-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
# 2. SERVICIO NODEPORT PARA EL BACKEND API
# Expone la aplicación hacia el exterior del clúster Minikube
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s08
  labels:
    app: backend-api
    tier: backend
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - name: http
      protocol: TCP
      port: 3000        # Puerto interno del servicio
      targetPort: 3000  # Puerto del contenedor (APP_PORT)
      nodePort: 30080   # Puerto estático expuesto en el nodo Minikube (rango 30000-32767)

