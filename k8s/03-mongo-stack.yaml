# ==============================================================================
# MANIFIESTO: 03-mongo-stack.yaml
# DESCRIPCIÓN: Despliegue interno de MongoDB y Servicio ClusterIP
# ==============================================================================

# 1. DEPLOYMENT DE MONGODB
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: practica-s08
  labels:
    app: mongodb
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
              name: mongo-port
          env:
            # Inyección de usuario root desde Secret (db-secret)
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            # Inyección de contraseña root desde Secret (db-secret)
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASS
            # Inyección de la base de datos por defecto desde ConfigMap (app-configmap)
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-configmap
                  key: DB_NAME
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
# 2. SERVICIO CLUSTERIP PARA MONGODB
# Solo expuesto internamente en el clúster; inaccesible desde el exterior
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: practica-s08
  labels:
    app: mongodb
    tier: database
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongo-port
      protocol: TCP
      port: 27017
      targetPort: 27017

